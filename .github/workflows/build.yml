name: Build NeonRunner IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          rm -rf build
          xcodebuild \
            -project NeonRunner.xcodeproj \
            -scheme NeonRunner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          rm -rf Payload NeonRunner-IPA
          mkdir -p Payload NeonRunner-IPA

          cp -R \
            build/Build/Products/Release-iphoneos/NeonRunner.app \
            Payload/

          test -f Payload/NeonRunner.app/www/index.html

          mkdir -p NeonRunner-IPA
          cd Payload
          zip -qry ../NeonRunner-IPA/NeonRunner.ipa NeonRunner.app
          cd ..

          cd NeonRunner-IPA
          zip -qry NeonRunner-IPA.zip NeonRunner.ipa

      - name: Verify IPA
        run: |
          unzip -l NeonRunner-IPA/NeonRunner.ipa | grep "Payload/NeonRunner.app/www/index.html"
          unzip -l NeonRunner-IPA/NeonRunner.ipa | grep "Payload/NeonRunner.app/www/game.js"
          unzip -l NeonRunner-IPA/NeonRunner.ipa | grep "Payload/NeonRunner.app/www/style.css"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeonRunner-IPA
          path: NeonRunner-IPA/
